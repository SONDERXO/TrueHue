# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon. 2 GB heap is comfortable for a project this size.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run Gradle deamon with the maximal working set.

# Must be true to use AndroidX libraries (required since AndroidX replaced the support library).
android.useAndroidX=true

# Official Kotlin code style.
kotlin.code.style=official

# Newer Android Gradle Plugin: generate only the R class for the module itself.
android.nonTransitiveRClass=true