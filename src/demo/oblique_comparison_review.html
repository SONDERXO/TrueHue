<!doctype html><html lang="en"><meta charset="utf-8"><title>Correction development review</title>
<style>body{font:16px system-ui;max-width:1150px;margin:24px auto;padding:0 20px}button,select,input,textarea{font:inherit;margin:5px;padding:8px}#panels{display:flex;gap:16px;overflow:auto}figure{margin:0}img{max-width:min(512px,100%);height:auto}label{display:block}#status{font-weight:bold}textarea{width:85%}button{cursor:pointer}#display{padding:12px;background:#eef2f6}</style>
<h1>Correction development review</h1><p id="preview-note" hidden></p><p>Compare all panels at the same size. Native view means the cached image at 100%, not the original photograph. Scores and model labels remain concealed.</p>
<section id="display"><h2>Viewing setup</h2><label>Browser <input id="browser"></label><label>Display resolution <input id="resolution"></label><label>Operating-system scale <input id="os_scale" placeholder="e.g. 100% or unknown"></label><label>Colour settings <input id="colour_settings" value="unknown"></label></section>
<p><button id="prev">Previous</button><span id="position"></span><button id="next">Next</button><button id="native">Native 100%</button></p><div id="panels"></div><div id="questions"></div>
<label>Reason or concern <textarea id="reason"></textarea></label><p><button id="save">Save ratings</button><button id="reload">Reload saved ratings</button><button id="download">Download saved JSON</button></p><p id="status" role="status">Not saved</p>
<script>
let manifest,state,index=0,dirty=false,saved=null;
const el=id=>document.getElementById(id);
function remember(){if(!manifest)return;const c=manifest.cases[index],r={reason:el('reason').value};for(const key of ['identity','preference','artifact'])if(el(key))r[key]=el(key).value;if((c.kind==='identity'&&r.identity)||(r.preference&&r.artifact))state.ratings[c.id]=r;else delete state.ratings[c.id];for(const k of ['browser','resolution','os_scale','colour_settings'])state.display[k]=el(k).value;}
function select(id,label,options,value){const wrap=document.createElement('label');wrap.textContent=label;const s=document.createElement('select');s.id=id;for(const v of ['',...options]){const o=document.createElement('option');o.value=v;o.textContent=v||'Choose…';s.append(o);}s.value=value||'';wrap.append(s);return wrap;}
function show(){const c=manifest.cases[index],r=state.ratings[c.id]||{};el('position').textContent=`Case ${index+1} of ${manifest.cases.length}`;el('panels').replaceChildren();for(const key of ['A','B','R'])if(c[key]){const f=document.createElement('figure'),cap=document.createElement('figcaption'),im=document.createElement('img');cap.textContent=key==='R'?'R — photographic reference':key;im.src=c[key];im.alt=cap.textContent;f.append(cap,im);el('panels').append(f);}el('questions').replaceChildren();if(c.kind==='identity')el('questions').append(select('identity','Is there a noticeable change in brightness, colour, natural appearance, boundaries or protection?',['no_noticeable_change','noticeable_change','cannot_judge'],r.identity));else{el('questions').append(select('preference','Which panel is usefully closer to R?',['A','B','no_noticeable_difference','both_unacceptable','cannot_judge'],r.preference));el('questions').append(select('artifact','Which panel has a visibly unwanted artifact?',['A','B','both','none','cannot_judge'],r.artifact));}el('reason').value=r.reason||'';}
async function request(path,options){const r=await fetch(path,options),v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v;}
function restore(v){if(v&&v.protocol_id!==manifest.protocol_id)throw Error('Saved protocol mismatch');state=v||{protocol_id:manifest.protocol_id,display:{browser:navigator.userAgent,resolution:`${screen.width} × ${screen.height}`,os_scale:'',colour_settings:'unknown'},ratings:{}};for(const k of ['browser','resolution','os_scale','colour_settings'])el(k).value=state.display[k]||'';dirty=false;show();}
el('prev').onclick=()=>{remember();index=Math.max(0,index-1);show();};el('next').onclick=()=>{remember();index=Math.min(manifest.cases.length-1,index+1);show();};
el('save').onclick=async()=>{try{remember();const result=await request('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});saved=await request('/latest');dirty=false;el('status').textContent=`Saved ${Object.keys(saved.ratings).length}/${manifest.cases.length} ratings to disk. ${result.complete?'All ratings saved.':'Partial progress saved.'}`;}catch(e){el('status').textContent='SAVE FAILED: '+e.message;}};
el('reload').onclick=async()=>{if(dirty&&!confirm('Replace unsaved changes with the saved ratings?'))return;try{saved=await request('/latest');restore(saved);el('status').textContent=saved?'Saved ratings reloaded.':'No saved ratings yet.';}catch(e){el('status').textContent=e.message;}};
el('download').onclick=async()=>{saved=await request('/latest');if(!saved){el('status').textContent='Save ratings first.';return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));a.download='correction-review-ratings.json';a.click();URL.revokeObjectURL(a.href);};
el('native').onclick=()=>{document.querySelectorAll('#panels img').forEach(im=>{im.style.maxWidth='none';im.style.width=im.naturalWidth+'px';});};
document.addEventListener('input',()=>{dirty=true;el('status').textContent='Unsaved changes — click Save ratings.';});document.addEventListener('change',()=>{dirty=true;el('status').textContent='Unsaved changes — click Save ratings.';});window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue='Unsaved ratings';}};
(async()=>{try{manifest=await request('/public');if(manifest.preview_note){el('preview-note').hidden=false;el('preview-note').textContent=manifest.preview_note;}saved=await request('/latest');restore(saved);if(saved)el('status').textContent='Saved ratings loaded.';}catch(e){el('status').textContent='Could not load review: '+e.message;}})();
</script></html>
